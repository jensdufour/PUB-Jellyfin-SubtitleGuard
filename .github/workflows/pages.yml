name: Publish Catalog
on:
  push:
    branches: [main]
    paths: [manifest.json, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage catalog only
        shell: pwsh
        run: |
          $catalog = Get-Content manifest.json -Raw | ConvertFrom-Json -NoEnumerate
          if ($catalog.Count -ne 1 -or $catalog[0].guid -ne 'a7c9c612-4b77-46ed-9b92-b32b83d2f771') { throw 'Invalid catalog identity' }
          New-Item "$env:RUNNER_TEMP/catalog-site" -ItemType Directory | Out-Null
          Copy-Item manifest.json "$env:RUNNER_TEMP/catalog-site/manifest.json"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/catalog-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4