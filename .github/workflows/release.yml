name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  actions: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install FFmpeg contract prerequisite
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core
          curl --fail --location --proto '=https' --proto-redir '=https' --retry 3 --max-time 180 \
            'https://repo.jellyfin.org/ubuntu/pool/main/j/jellyfin-ffmpeg/jellyfin-ffmpeg8_8.1.3-1-noble_amd64.deb' \
            --output "$RUNNER_TEMP/jellyfin-ffmpeg.deb"
          echo "188fa8b31f7e0ded9dadd1d11d1cd05482a7f03cec4e5c0af80aae21fde44ce4  $RUNNER_TEMP/jellyfin-ffmpeg.deb" | sha256sum --check --strict
          sudo apt-get install -y --no-install-recommends "$RUNNER_TEMP/jellyfin-ffmpeg.deb"
          binary="/usr/lib/jellyfin-ffmpeg/ffmpeg"
          test -x "$binary"
          "$binary" -version
          echo "FFMPEG_BIN=$binary" >> "$GITHUB_ENV"
      - name: Fetch checksum-pinned Jellyfin 12 host assemblies
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --proto-redir '=https' --retry 3 --max-time 180 \
            'https://repo.jellyfin.org/ubuntu/pool/main/j/jellyfin/jellyfin-server_12.0+ubu2404_amd64.deb' \
            --output "$RUNNER_TEMP/jellyfin-server.deb"
          echo "50f4283b72b2d78196d07718e9a4f2485896daad00909271858c4da7ca078658  $RUNNER_TEMP/jellyfin-server.deb" | sha256sum --check --strict
          dpkg-deb --extract "$RUNNER_TEMP/jellyfin-server.deb" "$RUNNER_TEMP/jellyfin-host"
          echo "JELLYFIN_BIN=$RUNNER_TEMP/jellyfin-host/usr/lib/jellyfin/bin" >> "$GITHUB_ENV"
      - name: Verify native guard
        run: |
          dotnet run --project Tests/RuntimeChecks.csproj -c Release -p:JellyfinBin="$JELLYFIN_BIN" -- --collectible
          dotnet run --project Tests/RuntimeChecks.csproj -c Release -p:JellyfinBin="$JELLYFIN_BIN"
          dotnet run --project Tests/RuntimeChecks.csproj -c Release -p:JellyfinBin="$JELLYFIN_BIN" -- --coverage-parser
          dotnet run --project Tests/RuntimeChecks.csproj -c Release -p:JellyfinBin="$JELLYFIN_BIN" -- --ass-style
          dotnet run --project Tests/RuntimeChecks.csproj -c Release -p:JellyfinBin="$JELLYFIN_BIN" -- --coverage-contract "$FFMPEG_BIN"
          dotnet run --project Tests/RuntimeChecks.csproj -c Release -p:JellyfinBin="$JELLYFIN_BIN" -- --window-contract "$FFMPEG_BIN"
          python3 Tests/native-hls-continuity.py --ffmpeg "$FFMPEG_BIN"
          python3 Tests/native-hls-continuity.py --ffmpeg "$FFMPEG_BIN" --container mpegts --ts-regression --mux child-timestamps --sample-rate 44100 --bframes 2
          python3 Tests/native-hls-continuity.py --ffmpeg "$FFMPEG_BIN" --container mpegts --ts-regression --mux child-timestamps --sample-rate 44100 --bframes 2 --source-container mkv
      - name: Verify Jellyfin 12.1 runtime
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --proto-redir '=https' --retry 3 --max-time 180 \
            'https://repo.jellyfin.org/ubuntu/pool/main/j/jellyfin/jellyfin-server_12.1+ubu2404_amd64.deb' \
            --output "$RUNNER_TEMP/jellyfin-server-12.1.deb"
          echo "b57edb75243b24c2ef619b62732a51d18ce1b8a0bf2f2bab9be47d1461b424e9  $RUNNER_TEMP/jellyfin-server-12.1.deb" | sha256sum --check --strict
          dpkg-deb --extract "$RUNNER_TEMP/jellyfin-server-12.1.deb" "$RUNNER_TEMP/jellyfin-host-12.1"
          cp -a Tests/bin/Release/net10.0 "$RUNNER_TEMP/checks-12.1"
          cp "$RUNNER_TEMP/jellyfin-host-12.1/usr/lib/jellyfin/bin/"*.dll "$RUNNER_TEMP/checks-12.1/"
          dotnet "$RUNNER_TEMP/checks-12.1/RuntimeChecks.dll" --collectible
      - name: Verify Jellyfin 12.4 native playlist clock
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --proto-redir '=https' --retry 3 --max-time 180 \
            'https://repo.jellyfin.org/ubuntu/pool/main/j/jellyfin/jellyfin-server_12.4+ubu2404_amd64.deb' \
            --output "$RUNNER_TEMP/jellyfin-server-12.4.deb"
          echo "88b9ff091677588686644d8da61c21c2e9fbd9bb99296b380e9c0efa8ec68285  $RUNNER_TEMP/jellyfin-server-12.4.deb" | sha256sum --check --strict
          dpkg-deb --extract "$RUNNER_TEMP/jellyfin-server-12.4.deb" "$RUNNER_TEMP/jellyfin-host-12.4"
          host="$RUNNER_TEMP/jellyfin-host-12.4/usr/lib/jellyfin/bin"
          dotnet run --project Tests/RuntimeChecks.csproj -c Release -p:NativeHostChecks=true -p:JellyfinBin="$host" -- --hls-hooks "$host"
          dotnet run --project Tests/RuntimeChecks.csproj -c Release -p:NativeHostChecks=true -p:JellyfinBin="$host" -- --collectible
          dotnet run --project Tests/RuntimeChecks.csproj -c Release -p:NativeHostChecks=true -p:JellyfinBin="$host" -- --coverage-parser
          dotnet run --project Tests/RuntimeChecks.csproj -c Release -p:NativeHostChecks=true -p:JellyfinBin="$host" -- --coverage-contract "$FFMPEG_BIN"
      - name: Verify plugin-owned Web subtitle UX
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --proto-redir '=https' --retry 3 --max-time 180 \
            'https://repo.jellyfin.org/ubuntu/pool/main/j/jellyfin/jellyfin-web_12.4+ubu2404_all.deb' \
            --output "$RUNNER_TEMP/jellyfin-web-12.4.deb"
          echo "0da66acfc2da32490df576ed5fd9e95634dddfd5f1fd14dd735b31d1dcb7fcf7  $RUNNER_TEMP/jellyfin-web-12.4.deb" | sha256sum --check --strict
          dpkg-deb --extract "$RUNNER_TEMP/jellyfin-web-12.4.deb" "$RUNNER_TEMP/jellyfin-web-12.4"
          chunk="$RUNNER_TEMP/jellyfin-web-12.4/usr/share/jellyfin/web/htmlVideoPlayer-plugin.02b37b7cfd0e06696bd1.chunk.js"
          candidate="$RUNNER_TEMP/subtitleguard-player.chunk.js"
          host="$RUNNER_TEMP/jellyfin-host-12.4/usr/lib/jellyfin/bin"
          dotnet run --project Tests/RuntimeChecks.csproj -c Release -p:NativeHostChecks=true -p:JellyfinBin="$host" -- --web-ux "$chunk" "$candidate"
          node Tests/test-web-subtitle-ux.cjs "$chunk" "$candidate"
      - name: Package
        id: package
        shell: pwsh
        run: |
          $version = ([xml](Get-Content SubtitleGuard.csproj -Raw)).Project.PropertyGroup.Version
          if ($env:GITHUB_REF_NAME -cne "v$version") { throw 'Tag does not match project version' }
          $package = ./scripts/package.ps1 -JellyfinBin $env:JELLYFIN_BIN | ConvertFrom-Json
          $zip = [IO.Compression.ZipFile]::OpenRead($package.Archive)
          try {
              $expected = @('0Harmony.dll', 'Jellyfin.Plugin.SubtitleGuard.Prototype.dll')
              if ($zip.Entries.Count -ne 2 -or (Compare-Object @($zip.Entries.FullName) $expected)) { throw 'Unexpected package contents' }
          } finally { $zip.Dispose() }
          "$($package.SHA256)  $([IO.Path]::GetFileName($package.Archive))" | Set-Content "$($package.Archive).sha256"
          "archive=$($package.Archive)" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "checksum=$((Get-FileHash $package.Archive -Algorithm MD5).Hash.ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: gh release create "$GITHUB_REF_NAME" "$ARCHIVE" "$ARCHIVE.sha256" --verify-tag --generate-notes
      - name: Update catalog
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
          RELEASE_CHECKSUM: ${{ steps.package.outputs.checksum }}
        run: |
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { throw 'Catalog fetch failed' }
          git switch main
          if ($LASTEXITCODE -ne 0) { throw 'Catalog checkout failed' }
          git merge --ff-only origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Catalog update is not fast-forward' }
          ./scripts/update-manifest.ps1 -Version $env:RELEASE_VERSION -Checksum $env:RELEASE_CHECKSUM -Timestamp ([datetimeoffset]::UtcNow.ToString('O'))
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit --only -m "Release $env:GITHUB_REF_NAME catalog" -- manifest.json
          if ($LASTEXITCODE -ne 0) { throw 'Catalog commit failed' }
          git push origin main
          if ($LASTEXITCODE -ne 0) { throw 'Catalog push failed' }
          gh workflow run pages.yml --ref main
          if ($LASTEXITCODE -ne 0) { throw 'Catalog deployment dispatch failed' }